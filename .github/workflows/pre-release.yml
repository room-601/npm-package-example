name: Pre-release

on:
  workflow_call:
    inputs:
      actions:
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  pre-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # for GitHub Packages

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # current branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@room-601'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check for changeset files
        id: check-changesets
        run: |
          if [ -z "$(find .changeset -name '*.md' -not -name 'README.md' 2>/dev/null)" ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changeset files found. Skipping version update."
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Changeset files found. Proceeding with version update."
          fi
      
      # 両方のレジストリに認証情報を設定
      # GitHub Packages用: NODE_AUTH_TOKENはsetup-node@v4で自動設定される
      # npmjs用: postpublishスクリプト内でNPM_TOKENを使用
      - name: Configure npm authentication for npmjs
        run: |
          npm set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      # ===============================
      # Enter pre-release mode
      # ===============================
      - name: Enter pre-release mode
        if: inputs.actions == 'enter-and-publish' && steps.check-changesets.outputs.has_changesets == 'true'
        run: |
          # pre-release modeに入る
          # すでにpre-releaseの場合はスキップする
          if [ ! -f .changeset/pre.json ]; then
            npx changeset pre enter next
          else
            echo "Already in pre-release mode"
          fi
          npx changeset version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: pre-release"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Publish pre-release
        if: inputs.actions == 'enter-and-publish' && steps.check-changesets.outputs.has_changesets == 'true'
        run: |
          npm run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===============================
      # Exit pre-release mode
      # ===============================
      - name: Exit pre-release mode
        if: inputs.actions == 'exit' && steps.check-changesets.outputs.has_changesets == 'true'
        run: |
          npx changeset pre exit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: exit pre-release"
          git push
