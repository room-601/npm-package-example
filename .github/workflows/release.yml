name: Release

on:
  workflow_call:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write # for GitHub Packages
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@room-601'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      # 両方のレジストリに認証情報を設定
      # GitHub Packages用: NODE_AUTH_TOKENはsetup-node@v4で自動設定される
      # npmjs用: postpublishスクリプト内でNPM_TOKENを使用
      - name: Configure npm authentication for npmjs
        run: |
          npm set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
      
      # changesetがpublishを実行
      # 1. publishConfig.registryに従いGitHub Packagesにpublish
      # 2. 成功後、各パッケージのpostpublishスクリプトが自動実行され、npmjsにもpublish
      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run ci:version
          publish: npm run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}