name: Release

on:
  workflow_call:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

  publish-github-packages:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
          scope: '@room-601'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run ci:version
          publish: npm run ci:publish -- --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: publish-github-packages
    runs-on: ubuntu-latest
    if: needs.publish-github-packages.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npmjs
        run: |
          PUBLISHED_PACKAGES='${{ needs.publish-github-packages.outputs.publishedPackages }}'
          
          if [ "$PUBLISHED_PACKAGES" = "" ] || [ "$PUBLISHED_PACKAGES" = "[]" ]; then
            echo "No packages were published, skipping npmjs publish"
            exit 0
          fi
          
          echo "Published packages: $PUBLISHED_PACKAGES"
          
          echo "$PUBLISHED_PACKAGES" | jq -c '.[]' | while read -r package; do
            PACKAGE_NAME=$(echo "$package" | jq -r '.name')
            PACKAGE_BASE_NAME=$(echo "$PACKAGE_NAME" | awk -F'/' '{print $NF}')
            
            PKG_DIR="packages/$PACKAGE_BASE_NAME"
            
            if [ -d "$PKG_DIR" ]; then
              echo "Publishing $PKG_DIR to npmjs..."
              cd "$PKG_DIR"
              
              npm pkg set name="@kosuketakahashi0410/$PACKAGE_BASE_NAME"
              npm pkg set publishConfig.registry='https://registry.npmjs.org/'
              npm pkg set publishConfig.access='public'
              
              npm publish --ignore-scripts
              
              cd ../..
            else
              echo "Warning: Directory $PKG_DIR not found for package $PACKAGE_NAME"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}